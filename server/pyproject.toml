[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yibiao-check-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  # FastAPI 的 multipart/form-data 端点（P3a 的 POST /duplicate/files）必需。
  # 缺它时 FastAPI 在**路由注册期**就抛 RuntimeError，整个 app 起不来。
  "python-multipart>=0.0.9",
  "mammoth>=1.6",
  "markdownify>=0.13",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "openpyxl>=3.1",
  "charset-normalizer>=3.3",
  "pymupdf>=1.24",
  "Pillow>=10.0",
  # P3d：查重元数据段。olefile 仅做 CFB（.doc/.wps 复合文件）目录导航，
  # 属性集二进制解析在 app/domain/duplicate/metadata_ole.py 逐字移植参考实现。
  "olefile>=0.47",
  # R-P3d-10：PDF Info/XMP 读取对齐 pdf-parse@2（PDF.js）的 result 形状
  "pypdf>=6.19",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "python-docx>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  # starlette 1.6.0 内部在导入 TestClient 时发出的第三方弃用警告：
  # 其一建议改用 httpx2，其二引用了弃用的 anyio.abc.BlockingPortal。
  # 两者都不属于本项目代码；迁移 TestClient 到 httpx2 是独立的依赖决策，
  # 不夹在基础任务里（见 .superpowers/sdd/.../progress.md 的裁定 R5）。
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
